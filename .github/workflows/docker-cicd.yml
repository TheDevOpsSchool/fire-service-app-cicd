name: Docker Image CI

on:
  push:
    branches: [ "ElvDevOps" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    # - name: Build the Docker image
    #   run: docker build . --file dockerfile --tag elvdevops/fireservice
    # - uses: actions/checkout@v2  
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.ELV_DOCKER_USERNAME }}
        password: ${{ secrets.ELV_DOCKER_PASSWORD }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: dockerfile
        push: true
        tags: ${{ secrets.ELV_DOCKER_USERNAME }}/fireservice-app:latest

